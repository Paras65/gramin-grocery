<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gk_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gk_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gk_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#gk_bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#gk_amber)" stroke-width="12" stroke-opacity="0.9"/>

  <!-- Store Awning Canopy (Emerald & Gold Striped Roof) -->
  <g filter="url(#glow)">
    <!-- Awning Base -->
    <path d="M104 188 L408 188 L432 248 C432 268 408 276 392 258 C376 276 352 276 336 258 C320 276 296 276 280 258 C264 276 240 276 224 258 C208 276 184 276 168 258 C152 276 128 276 112 258 C96 276 80 268 80 248 Z" fill="url(#gk_emerald)"/>
    <!-- Canopy Stripes in Warm Gold -->
    <path d="M128 188 L144 260 C156 260 168 256 168 258 L160 188 Z" fill="url(#gk_amber)"/>
    <path d="M216 188 L216 260 C232 260 240 256 240 258 L240 188 Z" fill="url(#gk_amber)"/>
    <path d="M296 188 L288 260 C304 260 312 256 312 258 L320 188 Z" fill="url(#gk_amber)"/>
    <path d="M376 188 L360 260 C376 260 384 256 384 258 L392 188 Z" fill="url(#gk_amber)"/>
    <!-- Roof Peak Triangle -->
    <polygon points="256,104 104,188 408,188" fill="url(#gk_amber)"/>
  </g>

  <!-- Store Body / Building Pillars -->
  <rect x="116" y="260" width="280" height="152" rx="16" fill="#292524" stroke="#44403c" stroke-width="6"/>

  <!-- Store Door / Counter Center -->
  <path d="M208 412 V304 C208 288 304 288 304 304 V412 Z" fill="#1c1917" stroke="url(#gk_amber)" stroke-width="6"/>

  <!-- Indian Rupee (₹) Symbol inside Doorway in Glowing Gold -->
  <path d="M236 322 H276 M236 338 H276 M236 352 H256 C264 352 270 346 270 338 M244 352 L268 386" 
        stroke="url(#gk_amber)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Side Pillars Details -->
  <line x1="148" y1="260" x2="148" y2="412" stroke="#57534e" stroke-width="6"/>
  <line x1="364" y1="260" x2="364" y2="412" stroke="#57534e" stroke-width="6"/>

  <!-- Golden Wheat / Kirana Grain Motif Left & Right -->
  <g fill="url(#gk_amber)" opacity="0.95">
    <!-- Left Wheat Grains -->
    <ellipse cx="88" cy="330" rx="10" ry="18" transform="rotate(-30 88 330)"/>
    <ellipse cx="76" cy="356" rx="10" ry="18" transform="rotate(-40 76 356)"/>
    <ellipse cx="68" cy="386" rx="10" ry="18" transform="rotate(-50 68 386)"/>
    <!-- Right Wheat Grains -->
    <ellipse cx="424" cy="330" rx="10" ry="18" transform="rotate(30 424 330)"/>
    <ellipse cx="436" cy="356" rx="10" ry="18" transform="rotate(40 436 356)"/>
    <ellipse cx="444" cy="386" rx="10" ry="18" transform="rotate(50 444 386)"/>
  </g>
</svg>